name: ci

# PR ごとに検査する。main へのマージ後は deploy.yml がこのワークフローを呼び、通ってからデプロイする。
on:
  pull_request:
  workflow_call:

concurrency:
  # 呼び出されたときは github.event が呼び出し元（push など）になるため、run_id で別のグループにする
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # 過去に追加して削除した秘密情報も検出する。
          fetch-depth: 0
          persist-credentials: false

      # CLI を直接使うため、サービス用トークンやライセンスは不要。
      # 検出した秘密値はログに出さず、検出時は非ゼロで終了する。
      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --log-opts="--all --full-history"
          --redact --ignore-gitleaks-allow --no-banner

  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Dockerfile が壊れていないかだけを確かめる。イメージの push は deploy.yml で行う。
  image:
    name: image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, batch]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
