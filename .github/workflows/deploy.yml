name: deploy

# main へのマージで、ci.yml の検査を通してから次を行う。
# - 画面: ビルドしてサイト用バケットへ置き、Cloud CDN のキャッシュを消す
# - 保存 API: ルートの package.json の version のタグ（vX.Y.Z）がまだ無ければ、
#   イメージを Artifact Registry に push し、タグと GitHub Release を作る。
#   どのタグを動かすかは maaun-terraform の tfvars で指定するため、Cloud Run は更新しない。
# データ更新後は batch.yml が web.yml を呼び、画面だけを作り直す。
# repository_dispatch は旧 Workflows からの移行中も受け付ける。
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'repository_dispatch'
    uses: ./.github/workflows/ci.yml

  web:
    needs: check
    # repository_dispatch では check を飛ばすため、skipped でも進める。
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/web.yml

  # package.json の version のタグがまだ無いときだけリリースする。版を上げない PR のマージでは何もしない。
  version:
    name: version
    needs: check
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be a semantic version such as 1.2.3: ${version}"
            exit 1
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} はリリース済みのため、イメージは push しない"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "release=true" >> "${GITHUB_OUTPUT}"
          fi

  images:
    name: image (${{ matrix.app }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api]
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_PREFIX }}-${{ matrix.app }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      # provenance/SBOM を付けると 1 リリースが 3 バージョンになり、
      # Artifact Registry の保持数（バージョン数で数える）を食うため付けない。
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.app }}

  # 保存 API のイメージを push できてからタグを付ける。途中で失敗しても、再実行すれば同じタグで置き直す。
  release:
    name: release
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
